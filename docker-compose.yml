services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-flashsales
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - flashsales-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-flashsales
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flashsales-network

  redis:
    image: redis:7-alpine
    container_name: redis-flashsales
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - flashsales-network

volumes:
  postgres-data:
  redis-data:

networks:
  flashsales-network:
    driver: bridge